name: Patch Aula 02 remaster images

on:
  push:
    paths:
      - '.github/workflows/patch-aula02-remaster-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Aula 02 image references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '20260817-remaster2'

          html_path = Path('aula-02-aprofundamento.html')
          html = html_path.read_text(encoding='utf-8')

          html = html.replace(
              '<script defer src="script.js?v=20260817-fig02b"></script>',
              f'<script defer src="script.js?v={version}"></script>'
          )
          html = html.replace(
              '<script defer src="script.js"></script>',
              f'<script defer src="script.js?v={version}"></script>'
          )

          specs = {
              '03': ('Arquitetura conceitual de um sistema especialista', 'Arquitetura conceitual simplificada de um sistema especialista.'),
              '04': ('Fluxo do especialista à inferência em um sistema baseado em regras', 'Nos sistemas especialistas clássicos, novos casos não atualizam automaticamente as regras.'),
              '05': ('Cinco lentes para compreender a evolução da Inteligência Artificial', 'Cinco lentes para comparar abordagens: representação, origem do conhecimento, produção da resposta, papel das pessoas e critério de desempenho.'),
              '06': ('Comparação entre automação, regras, IA e sistemas híbridos', 'Quatro formas de estruturar soluções computacionais e seus diferentes papéis.'),
              '07': ('Ciclo básico de interação de um agente', 'Ambiente, percepções, agente, ações e novo estado do ambiente formam um ciclo contínuo.'),
              '08': ('Estudo de caso de um aspirador robô como agente', 'O aspirador robô ajuda a visualizar objetivo, ambiente, percepções, estado, decisão, ações e critérios de desempenho.'),
          }

          for number, (alt, caption) in specs.items():
              old_webp = f'<img src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}.webp" alt="{alt}">'
              old_png = f'<img src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}.png" alt="{alt}">'
              new = (
                  f'<img src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}.png?v={version}" '
                  f'data-light-src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}.png?v={version}" '
                  f'data-dark-src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}-dark.png?v={version}" '
                  f'alt="{alt}">'
              )
              if old_webp in html:
                  html = html.replace(old_webp, new)
              elif old_png in html:
                  html = html.replace(old_png, new)
              elif f'aula-02-aprofundamento-{number}.png?v=' not in html:
                  raise SystemExit(f'Image tag {number} not found in HTML')

          html_path.write_text(html, encoding='utf-8')

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')

          for number, alt in [
              ('03', 'Arquitetura conceitual de um sistema especialista'),
              ('04', 'Fluxo do especialista à inferência em um sistema baseado em regras'),
          ]:
              old_webp = f'<img src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}.webp" alt="{alt}">'
              old_png = f'<img src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}.png" alt="{alt}">'
              new = (
                  f'<img src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}.png?v={version}" '
                  f'data-light-src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}.png?v={version}" '
                  f'data-dark-src="assets/aula-02-aprofundamento/aula-02-aprofundamento-{number}-dark.png?v={version}" '
                  f'alt="{alt}">'
              )
              if old_webp in script:
                  script = script.replace(old_webp, new)
              elif old_png in script:
                  script = script.replace(old_png, new)
              elif f'aula-02-aprofundamento-{number}.png?v=' not in script:
                  raise SystemExit(f'Dynamic image tag {number} not found in script.js')

          script = script.replace(
              "? new URL('script-base.js?v=20260817-fig02b', loaderScript.src).href\n    : 'script-base.js?v=20260817-fig02b';",
              f"? new URL('script-base.js?v={version}', loaderScript.src).href\n    : 'script-base.js?v={version}';"
          )
          script = script.replace(
              "? new URL('script-base.js', loaderScript.src).href\n    : 'script-base.js';",
              f"? new URL('script-base.js?v={version}', loaderScript.src).href\n    : 'script-base.js?v={version}';"
          )
          script_path.write_text(script, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- aula-02-aprofundamento.html script.js; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aula-02-aprofundamento.html script.js
          git commit -m 'Ajusta imagens 03 a 08 para versões clara e escura'
          git push origin HEAD:main
