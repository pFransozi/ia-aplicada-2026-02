name: Atualização única Aula 05

on:
  push:
    paths:
      - '.github/workflows/aula05-once.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar atualização
        run: python tools/aula05_patch_once.py

      - name: Commitar resultado e limpar utilitários temporários
        run: |
          rm -f .github/workflows/aula05-once.yml tools/aula05_patch_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Melhorar admissibilidade e adicionar prática da Aula 05"
          git push
