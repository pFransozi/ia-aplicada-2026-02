name: Materializar revisão da Aula 03

on:
  push:
    paths:
      - '.github/workflows/rebuild-aula03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reconstruir e validar o HTML
        shell: bash
        run: |
          cat .tmp/aula03/part01.html \
              .tmp/aula03/part02.html \
              .tmp/aula03/part03.html \
              .tmp/aula03/part04.html \
              > aula-03-aprofundamento.html
          test "$(wc -c < aula-03-aprofundamento.html)" -eq 46801
          echo '18e2c78e66ef78f40aa01df79bf2b4d49791cfdf87054c8885d20cfc1d973600  aula-03-aprofundamento.html' | sha256sum -c -

      - name: Remover arquivos temporários
        shell: bash
        run: |
          rm -rf .tmp/aula03
          rm -f .github/workflows/rebuild-aula03.yml

      - name: Registrar revisão no branch principal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aula-03-aprofundamento.html .tmp/aula03 .github/workflows/rebuild-aula03.yml
          git commit -m 'docs: revisa aprofundamento da aula 03'
          git push origin HEAD:main
