name: Patch Aula 02 figure cache

on:
  push:
    paths:
      - '.github/workflows/patch-aula02-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch figure 02 cache and theme handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('aula-02-aprofundamento.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace(
              '<script defer src="script.js"></script>',
              '<script defer src="script.js?v=20260817-fig02b"></script>'
          )
          old_img = '<img src="assets/aula-02-aprofundamento/aula-02-aprofundamento-02.png" data-light-src="assets/aula-02-aprofundamento/aula-02-aprofundamento-02.png" data-dark-src="assets/aula-02-aprofundamento/aula-02-aprofundamento-02-dark.png" alt="Infográfico das etapas de resolução simbólica de problemas em IA">'
          new_img = '<img src="assets/aula-02-aprofundamento/aula-02-aprofundamento-02.png?v=20260817-fig02b" data-light-src="assets/aula-02-aprofundamento/aula-02-aprofundamento-02.png?v=20260817-fig02b" data-dark-src="assets/aula-02-aprofundamento/aula-02-aprofundamento-02-dark.png?v=20260817-fig02b" alt="Infográfico das etapas de resolução simbólica de problemas em IA">'
          if old_img not in html:
              raise SystemExit('Figure 02 tag not found in HTML')
          html = html.replace(old_img, new_img)
          html_path.write_text(html, encoding='utf-8')

          base_path = Path('script-base.js')
          base = base_path.read_text(encoding='utf-8')
          old_block = '''  deepDiveImages.forEach((image) => {\n    const currentSrc = image.getAttribute('src');\n    if (!currentSrc) return;\n\n    const lightSrc = currentSrc.replace(/\\.webp$/i, '.png');\n    image.setAttribute('src', lightSrc);\n    image.dataset.lightSrc = lightSrc;\n\n    // Convenção já preparada para futuras versões noturnas:\n    // aula-02-aprofundamento-01-dark.png, ...-08-dark.png.\n    // O data-dark-src só é habilitado se o arquivo realmente existir,\n    // evitando imagens quebradas enquanto os arquivos dark não forem publicados.\n    const darkSrc = lightSrc.replace(/\\.png$/i, '-dark.png');\n    const probe = new Image();\n\n    probe.onload = () => {\n      image.dataset.darkSrc = darkSrc;\n      if (document.body.classList.contains('theme-dark')) {\n        image.setAttribute('src', darkSrc);\n      }\n    };\n\n    probe.src = darkSrc;\n  });'''
          new_block = '''  deepDiveImages.forEach((image) => {\n    const explicitLight = image.dataset.lightSrc;\n    const explicitDark = image.dataset.darkSrc;\n\n    // Quando o HTML fornece as duas versões explicitamente, respeite esses\n    // caminhos (inclusive query strings de cache-busting) e não os recalcule.\n    if (explicitLight && explicitDark) {\n      image.setAttribute(\n        'src',\n        document.body.classList.contains('theme-dark') ? explicitDark : explicitLight\n      );\n      return;\n    }\n\n    const currentSrc = image.getAttribute('src');\n    if (!currentSrc) return;\n\n    const lightSrc = currentSrc.replace(/\\.webp$/i, '.png');\n    image.setAttribute('src', lightSrc);\n    image.dataset.lightSrc = lightSrc;\n\n    // Convenção já preparada para futuras versões noturnas:\n    // aula-02-aprofundamento-01-dark.png, ...-08-dark.png.\n    // O data-dark-src só é habilitado se o arquivo realmente existir,\n    // evitando imagens quebradas enquanto os arquivos dark não forem publicados.\n    const darkSrc = lightSrc.replace(/\\.png$/i, '-dark.png');\n    const probe = new Image();\n\n    probe.onload = () => {\n      image.dataset.darkSrc = darkSrc;\n      if (document.body.classList.contains('theme-dark')) {\n        image.setAttribute('src', darkSrc);\n      }\n    };\n\n    probe.src = darkSrc;\n  });'''
          if old_block not in base:
              raise SystemExit('Deep-dive image block not found in script-base.js')
          base = base.replace(old_block, new_block)
          base_path.write_text(base, encoding='utf-8')

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          old_loader = "    ? new URL('script-base.js', loaderScript.src).href\n    : 'script-base.js';"
          new_loader = "    ? new URL('script-base.js?v=20260817-fig02b', loaderScript.src).href\n    : 'script-base.js?v=20260817-fig02b';"
          if old_loader not in script:
              raise SystemExit('Base-script loader not found in script.js')
          script = script.replace(old_loader, new_loader)
          script_path.write_text(script, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aula-02-aprofundamento.html script.js script-base.js
          git commit -m 'Corrige cache e alternância da figura 02'
          git push origin HEAD:main
