name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        run: |
          rm -rf dist
          mkdir -p dist
          rsync -av --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/

      - name: Validate generated site
        run: |
          test -f dist/index.html
          test -f dist/curso.html
          test -f dist/aula-02.html
          test -f dist/calendario-a.html
          test -f dist/calendario-b.html
          test -f dist/assets/infografico.png
          test -f dist/assets/infografico-dark.png
          grep -q 'calendario-a.html' dist/curso.html
          grep -q 'calendario-b.html' dist/curso.html

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
