name: Corrigir teoria da Aula 05

on:
  push:
    paths:
      - '.github/workflows/fix-aula05-theory.yml'

permissions:
  contents: write

jobs:
  fix-aula05:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correções teóricas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('aula-05.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Trecho esperado não encontrado: {old[:120]!r}')
              text = text.replace(old, new, 1)

          # 1) Unidade do mapa: os valores da figura de Russell & Norvig são apresentados
          # em milhas na fonte. No material didático, tratamos os números como unidades
          # de distância consistentes, evitando rotulá-los incorretamente como quilômetros.
          replace_once(
              'alt="Mapa da Romênia com cidades, estradas e distâncias em quilômetros."><figcaption>Mapa utilizado na aula. Cada cidade será um estado; cada estrada permitirá uma transição.',
              'alt="Mapa da Romênia com cidades, estradas e valores de distância entre cidades."><figcaption>Mapa utilizado na aula. Cada cidade será um estado; cada estrada permitirá uma transição. Os valores são os da figura original de Russell e Norvig, apresentada em milhas; aqui eles são tratados como unidades de distância do problema.'
          )

          replace_once(
              '<p><strong>Estado e caminho são diferentes:</strong> <code>"Sibiu"</code> é um estado; <code>["Arad", "Sibiu"]</code> é um caminho. Podemos chegar à mesma cidade por caminhos com custos diferentes.</p><h3>Transforme uma conexão em Python</h3>',
              '<p><strong>Estado e caminho são diferentes:</strong> <code>"Sibiu"</code> é um estado; <code>["Arad", "Sibiu"]</code> é um caminho. Podemos chegar à mesma cidade por caminhos com custos diferentes.</p><p class="note-banner"><strong>Simplificação usada no código:</strong> no modelo formal de busca, podemos distinguir a ação, o estado resultante e o custo da transição. Para manter a implementação didática enxuta, a função <code>sucessores</code> reúne essas informações em pares <code>(estado_resultante, custo)</code>. Assim, <code>("Sibiu", 140)</code> pode ser lido como “ir para Sibiu, chegando ao estado Sibiu, com custo 140”.</p><h3>Transforme uma conexão em Python</h3>'
          )

          replace_once(
              'A heurística <strong>h(estado)</strong> estima o custo restante até o objetivo. Neste mapa, usamos a distância em linha reta até Bucharest, em quilômetros. A estrada pode fazer curvas e passar por outras cidades; por isso, a estimativa não é o custo real do percurso.',
              'A heurística <strong>h(estado)</strong> estima o custo restante até o objetivo. Neste mapa, usamos a distância em linha reta até Bucharest, expressa nas mesmas unidades de distância do problema. A estrada pode fazer curvas e passar por outras cidades; por isso, a estimativa não é o custo real do percurso.'
          )

          replace_once(
              '# Distâncias em linha reta até Bucharest, em quilômetros.',
              '# Valores de h: distância em linha reta até Bucharest, nas mesmas unidades do mapa.'
          )

          # Padroniza as unidades restantes no texto, no simulador e nos rótulos acessíveis.
          text = re.sub(r'(\d+) km\b', r'\1 unidades', text)
          text = text.replace('(km)', '(unid.)')
          text = text.replace('em km.', 'em unidades de distância.')
          text = text.replace(' quilômetros', ' unidades de distância')

          # 2) melhor_g e reexpansão: separar o comportamento geral do caso específico
          # da heurística de linha reta, que é consistente.
          replace_once(
              '<p><strong>Por que não copiar apenas o conjunto de visitados da greedy?</strong> No A*, uma cidade pode precisar ser explorada novamente após uma melhoria de custo. Como a entrada antiga pode continuar no heap, o teste <code>g_atual &gt; melhor_g[estado]</code> descarta alternativas desatualizadas. Não precisamos procurar e editar uma tupla dentro do heap.</p>',
              '<p><strong>Por que não copiar apenas o conjunto de visitados da greedy?</strong> Aqui usamos uma implementação baseada no melhor custo conhecido para cada estado. Se uma rota mais barata for descoberta, <code>melhor_g</code> é atualizado e uma nova entrada é inserida; a entrada antiga pode permanecer no heap, e o teste <code>g_atual &gt; melhor_g[estado]</code> descarta essa alternativa desatualizada. Em problemas com heurísticas admissíveis, mas inconsistentes, essa estratégia também permite reprocessar um estado quando surge uma rota melhor. <strong>Neste mapa, porém, a distância em linha reta é consistente</strong>; por isso, depois que um estado é retirado validamente com seu menor custo, não será necessário reexpandí-lo por uma rota posteriormente mais barata.</p>'
          )

          # 3) Qualificar corretamente a garantia de otimalidade.
          replace_once(
              '<p><strong>Em que sentido A* aprimora a greedy?</strong> Ele considera o custo do caminho na escolha e aceita rotas melhores para um mesmo estado. Com as condições de <a href="#admissibilidade">admissibilidade apresentadas a seguir</a> e esta implementação, encontra uma solução de menor custo. Isso não significa executar mais rápido: pode explorar mais alternativas e consumir mais memória que a greedy.</p>',
              '<p><strong>Em que sentido A* aprimora a greedy?</strong> Ele considera o custo do caminho na escolha e aceita rotas melhores para um mesmo estado. <strong>Neste problema, com custos positivos e uma heurística admissível, esta implementação encontra uma solução de menor custo.</strong> A heurística de linha reta usada aqui é, além disso, consistente. Isso não significa executar mais rápido: o A* pode explorar mais alternativas e consumir mais memória que a greedy.</p>'
          )

          # 4) Acrescentar consistência logo após admissibilidade, conectando teoria e código.
          replace_once(
              '<p class="note-banner"><strong>Não confunda:</strong> h(n) não informa o custo da estrada seguinte e não informa o custo exato da rota. Ela apenas estima quanto ainda falta até o objetivo.</p>\n\n</div></section>',
              '<p class="note-banner"><strong>Não confunda:</strong> h(n) não informa o custo da estrada seguinte e não informa o custo exato da rota. Ela apenas estima quanto ainda falta até o objetivo.</p>\n\n<h3>5. Consistência: comparar estados vizinhos</h3>\n<p>A admissibilidade compara <code>h(n)</code> com o melhor custo real restante. A <strong>consistência</strong> faz uma verificação local entre estados vizinhos. Para toda transição de <code>n</code> para <code>n\'</code>, com custo <code>c(n,n\')</code>, deve valer:</p>\n<p class="note-banner" style="text-align:center;font-size:1.15rem"><strong>h(n) ≤ c(n,n\') + h(n\')</strong></p>\n<p>Leia assim: <strong>“a estimativa a partir do estado atual não pode ser maior do que dar um passo até um vizinho e, a partir dele, continuar estimando.”</strong> Toda heurística consistente é admissível, embora uma heurística admissível não seja necessariamente consistente.</p>\n<p>No mapa da Romênia, a distância em linha reta até Bucharest é consistente. Pela desigualdade triangular, ir diretamente em linha reta nunca é mais longo do que ir primeiro até uma cidade vizinha e depois seguir em linha reta até o objetivo.</p>\n<p class="note-banner"><strong>Consequência para o A*:</strong> com uma heurística consistente, os valores de <code>f = g + h</code> não diminuem ao longo de um caminho. Em uma busca em grafo, quando um estado é retirado validamente da fronteira, seu melhor custo já foi estabelecido; por isso, não é necessário reexpandi-lo por uma rota posteriormente mais barata. O uso de <code>melhor_g</code> continua útil para descartar entradas antigas e mantém a implementação robusta.</p>\n\n</div></section>'
          )

          # Conteúdo programático e fechamento passam a explicitar consistência.
          text = text.replace(
              '<div>Comparação guiada e admissibilidade</div>',
              '<div>Comparação guiada, admissibilidade e consistência</div>',
              1
          )
          text = text.replace(
              'e o que torna uma heurística admissível.</p>',
              'o que torna uma heurística admissível; e o que significa uma heurística consistente.</p>',
              1
          )
          text = text.replace(
              '<a href="#admissibilidade">7. Admissibilidade: não superestimar</a>',
              '<a href="#admissibilidade">7. Admissibilidade e consistência</a>',
              1
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remover workflow temporário
        run: rm -f .github/workflows/fix-aula05-theory.yml

      - name: Commitar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aula-05.html .github/workflows/fix-aula05-theory.yml
          git commit -m "fix: corrigir inconsistências teóricas da aula 05"
          git push
