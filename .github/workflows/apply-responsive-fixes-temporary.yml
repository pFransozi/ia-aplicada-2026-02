name: Limpar branch temporária de responsividade

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remover automação e branch temporárias
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/apply-responsive-fixes-temporary.yml
          git commit -m "chore: remove automação temporária de responsividade"
          git push origin HEAD:main
          git push origin --delete chore/responsividade-geral-20260820 || true
