  <style>
    :root {
      --ink: #172033;
      --muted: #647087;
      --line: #dfe5ef;
       --soft: #f4f7fb;
       --paper: #ffffff;
      --navy: #0f172a;
      --blue: #3157d5;
      --blue-soft: #edf2ff;
       --violet: #7357d8;
      --violet-soft: #f2efff;
      --teal: #17857b;
      --teal-soft: #eaf8f6;
      --amber: #9c5a00;
      --amber-soft: #fff7e8;
      --rose: #a63753;
      --rose-soft: #fff0f4;
      --content: 1160px;
      --radius: 22px;
      --shadow: 0 18px 48px rgba(35, 50, 78, .09);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.68;
    }
    a { color: inherit; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1, h2, h3, h4 { line-height: 1.16; letter-spacing: -.025em; }
    h1 { font-size: clamp(2.6rem, 6vw, 5.3rem); max-width: 13ch; margin-bottom: 1.15rem; }
    h2 { font-size: clamp(1.9rem, 4vw, 3.15rem); margin-bottom: 1rem; }
    h3 { font-size: clamp(1.25rem, 2.2vw, 1.7rem); margin-bottom: .7rem; }
    h4 { font-size: 1.08rem; margin-bottom: .45rem; }
    p, li { color: var(--muted); }
    strong { color: var(--ink); }

    .skip-link {
      position: fixed; left: 12px; top: -60px; z-index: 1000;
      background: white; color: #111827; padding: .7rem 1rem; border-radius: 10px; box-shadow: var(--shadow);
    }
    .skip-link:focus { top: 12px; }
    .progress {
      position: fixed; inset: 0 auto auto 0; height: 4px; width: 0;
      z-index: 999; background: linear-gradient(90deg, var(--blue), var(--violet), var(--teal));
    }
    .container { width: min(var(--content), calc(100% - 40px)); margin-inline: auto; }
    .section { padding: 82px 0; scroll-margin-top: 88px; }
    .section-soft { background: var(--soft); }
    .section-dark { background: var(--navy); color: white; }
    .section-dark p, .section-dark li { color: #cbd5e1; }
    .section-dark strong { color: white; }

    .site-header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,.9);
      border-bottom: 1px solid rgba(223,229,239,.9);
    }
    .nav { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { text-decoration: none; display: flex; align-items: center; gap: .8rem; font-weight: 800; }
    .brand-mark {
      display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px;
      color: white; background: linear-gradient(145deg, var(--blue), var(--violet)); box-shadow: 0 10px 24px rgba(49,87,213,.24);
      font-size: .92rem;
    }
    .brand small { display: block; font-size: .68rem; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .study-nav { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .85rem; }
    .study-nav a { text-decoration: none; color: var(--muted); font-size: .92rem; font-weight: 700; }
    .study-nav a:hover, .study-nav a.active { color: var(--blue); }

    .hero {
      position: relative; overflow: hidden; padding: 90px 0 74px;
      background:
        radial-gradient(circle at 88% 18%, rgba(115,87,216,.14), transparent 28%),
        radial-gradient(circle at 76% 76%, rgba(23,133,123,.11), transparent 24%),
        linear-gradient(180deg, #fbfcff 0%, #fff 100%);
    }
    .hero::after {
      content: ""; position: absolute; width: 520px; height: 520px; right: -250px; top: -180px;
      border: 1px solid rgba(49,87,213,.13); border-radius: 50%; box-shadow: 0 0 0 70px rgba(49,87,213,.025), 0 0 0 140px rgba(115,87,216,.018);
    }
    .hero-grid { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); gap: 48px; align-items: end; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: .5rem; margin-bottom: 1rem;
      color: var(--blue); font-size: .78rem; font-weight: 850; letter-spacing: .13em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 28px; height: 2px; background: currentColor; border-radius: 999px; }
    .hero-lead { font-size: clamp(1.08rem, 2vw, 1.3rem); max-width: 760px; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.5rem; }
    .hero-meta span { border: 1px solid var(--line); border-radius: 999px; padding: .35rem .75rem; color: var(--muted); font-size: .86rem; background: rgba(255,255,255,.8); }
    .hero-card { background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); }
    .hero-card strong { display: block; margin-bottom: .6rem; color: var(--blue); }
    .hero-card p:last-child { margin-bottom: 0; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.7rem; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 46px;
      padding: .78rem 1.05rem; border-radius: 13px; text-decoration: none; font-weight: 800; border: 1px solid transparent;
    }
    .button-primary { color: white; background: var(--navy); box-shadow: 0 12px 28px rgba(15,23,42,.18); }
    .button-secondary { color: var(--ink); background: white; border-color: var(--line); }

    .toc-shell { padding: 26px 0; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); }
    .toc { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 10px; }
    .toc a {
      display: block; padding: .78rem .9rem; border: 1px solid var(--line); border-radius: 13px;
      text-decoration: none; font-size: .84rem; font-weight: 800; line-height: 1.25; background: white;
    }
    .toc a:hover { border-color: #b9c7ff; color: var(--blue); box-shadow: 0 8px 20px rgba(49,87,213,.08); }

    .section-heading { max-width: 830px; margin-bottom: 2.3rem; }
    .section-heading p { font-size: 1.04rem; }
    .reading-grid { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(260px,.75fr); gap: 28px; align-items: start; }
    .prose p { margin-bottom: 1.15rem; }
    .prose ul, .prose ol { padding-left: 1.25rem; }
    .prose li + li { margin-top: .5rem; }
    .stack { display: grid; gap: 16px; }

    .callout {
      border-left: 4px solid var(--blue); background: var(--blue-soft); padding: 1.15rem 1.25rem; border-radius: 0 16px 16px 0;
    }
    .callout strong { display: block; margin-bottom: .35rem; color: var(--blue); }
    .callout p:last-child { margin-bottom: 0; }
    .callout.violet { border-left-color: var(--violet); background: var(--violet-soft); }
    .callout.violet strong { color: var(--violet); }
    .callout.teal { border-left-color: var(--teal); background: var(--teal-soft); }
