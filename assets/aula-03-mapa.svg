<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Mapa simplificado do ambiente do robô</title>
  <desc id="desc">Planta simplificada com Recepção, Corredor, Laboratório, Sala 101 e Copa. A Recepção é o ponto inicial e o Laboratório é o destino.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#16233d"/>
    </linearGradient>
    <linearGradient id="start" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243965"/>
      <stop offset="1" stop-color="#1b2d52"/>
    </linearGradient>
    <linearGradient id="goal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143f3c"/>
      <stop offset="1" stop-color="#102f2e"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="918" height="428" rx="28" fill="url(#panel)" stroke="#2a3a57" stroke-width="2"/>

  <text x="42" y="52" fill="#9bb0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="2">AMBIENTE DO PROBLEMA</text>
  <text x="42" y="82" fill="#95a3bb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Uma planta simplificada — ainda não é uma representação computacional.</text>

  <!-- corredor -->
  <rect x="185" y="164" width="550" height="96" rx="18" fill="#1d2a43" stroke="#41516e" stroke-width="2"/>
  <text x="460" y="220" fill="#eef4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" text-anchor="middle">Corredor</text>

  <!-- recepção -->
  <rect x="42" y="139" width="166" height="146" rx="20" fill="url(#start)" stroke="#6f91f5" stroke-width="2"/>
  <rect x="63" y="157" width="70" height="28" rx="14" fill="#3157d5"/>
  <text x="98" y="176" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">INÍCIO</text>
  <text x="125" y="229" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle">Recepção</text>

  <!-- laboratório -->
  <rect x="712" y="139" width="166" height="146" rx="20" fill="url(#goal)" stroke="#43bdb4" stroke-width="2"/>
  <rect x="733" y="157" width="78" height="28" rx="14" fill="#17857b"/>
  <text x="772" y="176" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">DESTINO</text>
  <text x="795" y="229" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">Laboratório</text>

  <!-- sala 101 -->
  <rect x="235" y="296" width="210" height="86" rx="18" fill="#18243a" stroke="#3b4b68" stroke-width="2"/>
  <text x="340" y="348" fill="#d8e0ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="middle">Sala 101</text>

  <!-- copa -->
  <rect x="475" y="296" width="210" height="86" rx="18" fill="#18243a" stroke="#3b4b68" stroke-width="2"/>
  <text x="580" y="348" fill="#d8e0ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750" text-anchor="middle">Copa</text>

  <!-- conexões, visualmente como portas -->
  <line x1="208" y1="212" x2="185" y2="212" stroke="#7f9eff" stroke-width="7" stroke-linecap="round"/>
  <line x1="735" y1="212" x2="712" y2="212" stroke="#57d0c7" stroke-width="7" stroke-linecap="round"/>
  <line x1="340" y1="260" x2="340" y2="296" stroke="#657590" stroke-width="7" stroke-linecap="round"/>
  <line x1="580" y1="260" x2="580" y2="296" stroke="#657590" stroke-width="7" stroke-linecap="round"/>

  <!-- legenda -->
  <circle cx="48" cy="402" r="5" fill="#7f9eff"/>
  <text x="63" y="408" fill="#95a3bb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">locais conectados permitem deslocamento</text>
</svg>