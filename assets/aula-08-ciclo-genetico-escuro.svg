<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Ciclo de vida de um algoritmo genético</title><desc id="desc">Etapas 1 a 8, seguidas de uma decisão: se o critério de parada não for satisfeito, voltar à seleção dos progenitores; caso contrário, retornar a melhor solução.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5.5 L1,10 Z" fill="#f1f3f5"/></marker></defs><rect width="1600" height="920" fill="#171717"/><text x="720" y="88" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="40"><tspan x="720" dy="0">Ciclo de vida de um algoritmo genético</tspan></text><rect x="38" y="180" width="218" height="145" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><circle cx="42" cy="177" r="25" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><text x="42" y="186" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" fill="#f1f3f5">1</text><text x="147" y="231.5" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="147" dy="0">Codificar o</tspan><tspan x="147" dy="30">espaço de</tspan><tspan x="147" dy="30">soluções</tspan></text><rect x="334" y="180" width="218" height="145" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><circle cx="338" cy="177" r="25" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><text x="338" y="186" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" fill="#f1f3f5">2</text><text x="443" y="231.5" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="443" dy="0">Definir</tspan><tspan x="443" dy="30">parâmetros do</tspan><tspan x="443" dy="30">algoritmo</tspan></text><rect x="630" y="180" width="218" height="145" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><circle cx="634" cy="177" r="25" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><text x="634" y="186" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" fill="#f1f3f5">3</text><text x="739" y="231.5" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="739" dy="0">Criar</tspan><tspan x="739" dy="30">população</tspan><tspan x="739" dy="30">inicial</tspan></text><rect x="926" y="180" width="218" height="145" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><circle cx="930" cy="177" r="25" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><text x="930" y="186" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" fill="#f1f3f5">4</text><text x="1035" y="231.5" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1035" dy="0">Avaliar a</tspan><tspan x="1035" dy="30">aptidão dos</tspan><tspan x="1035" dy="30">indivíduos</tspan></text><rect x="38" y="530" width="218" height="145" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><circle cx="42" cy="527" r="25" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><text x="42" y="536" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" fill="#f1f3f5">5</text><text x="147" y="596.5" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="147" dy="0">Selecionar</tspan><tspan x="147" dy="30">os progenitores</tspan></text><rect x="334" y="530" width="218" height="145" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><circle cx="338" cy="527" r="25" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><text x="338" y="536" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" fill="#f1f3f5">6</text><text x="443" y="596.5" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="443" dy="0">Gerar</tspan><tspan x="443" dy="30">descendentes</tspan></text><rect x="630" y="530" width="218" height="145" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><circle cx="634" cy="527" r="25" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><text x="634" y="536" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" fill="#f1f3f5">7</text><text x="739" y="581.5" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="739" dy="0">Formar a</tspan><tspan x="739" dy="30">próxima</tspan><tspan x="739" dy="30">geração</tspan></text><rect x="926" y="530" width="218" height="145" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><circle cx="930" cy="527" r="25" fill="#171717" stroke="#f1f3f5" stroke-width="2"/><text x="930" y="536" font-family="Arial,Helvetica,sans-serif" font-size="29" text-anchor="middle" fill="#f1f3f5">8</text><text x="1035" y="581.5" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22"><tspan x="1035" dy="0">Avaliar a</tspan><tspan x="1035" dy="30">nova</tspan><tspan x="1035" dy="30">geração</tspan></text><path d="M256 252 H332" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M552 252 H628" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M848 252 H924" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1035 325 V407 H146 V526" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M256 602 H332" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M552 602 H628" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M848 602 H924" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1144 602 H1175" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1365 602 H1450 V735" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1270 700 V765 H147 V677" fill="none" stroke="#f1f3f5" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1270 500 L1365 602 L1270 700 L1175 602 Z" fill="#171717" stroke="#f1f3f5" stroke-width="2.2"/><text x="1270" y="595" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="20"><tspan x="1270" dy="0">Critério</tspan><tspan x="1270" dy="30">de parada?</tspan></text><text x="1403" y="579" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="22">Sim</text><text x="685" y="753" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="23">Não</text><rect x="1325" y="735" width="250" height="140" fill="#171717" stroke="#f1f3f5" stroke-width="2.2"/><text x="1450" y="793" text-anchor="middle" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="19"><tspan x="1450" dy="0">Encerrar e</tspan><tspan x="1450" dy="30">retornar a</tspan><tspan x="1450" dy="30">melhor solução</tspan></text></svg>