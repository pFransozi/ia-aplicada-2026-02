<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Mapa simplificado do ambiente do problema — modo claro</title>
  <desc id="desc">Planta simplificada com Recepção, Corredor, Laboratório, Sala 101, Sala 102, Banheiro, Copa, Almoxarifado e Sala de Reunião. A Recepção é o ponto inicial e o Laboratório é o destino.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="corridor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f7fb"/></linearGradient>
    <linearGradient id="start" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="goal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fcfa"/><stop offset="1" stop-color="#e8f8f5"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#23324e" flood-opacity="0.08"/></filter>
  </defs>

  <rect x="1" y="1" width="918" height="468" rx="28" fill="url(#panel)" stroke="#dfe5ef" stroke-width="2" filter="url(#shadow)"/>
  <text x="42" y="46" fill="#3157d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="2">AMBIENTE DO PROBLEMA</text>
  <text x="42" y="74" fill="#647087" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5">Uma planta simplificada — ainda não é uma representação computacional.</text>

  <rect x="208" y="132" width="504" height="92" rx="19" fill="url(#corridor)" stroke="#d5ddea" stroke-width="2"/>
  <text x="460" y="187" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" text-anchor="middle">Corredor</text>

  <rect x="42" y="111" width="166" height="134" rx="21" fill="url(#start)" stroke="#4f7cf7" stroke-width="2.2"/>
  <rect x="62" y="130" width="74" height="27" rx="14" fill="#3157d5"/>
  <text x="99" y="148" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">INÍCIO</text>
  <text x="125" y="200" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle">Recepção</text>

  <rect x="712" y="111" width="166" height="134" rx="21" fill="url(#goal)" stroke="#22b8aa" stroke-width="2.2"/>
  <rect x="732" y="130" width="82" height="27" rx="14" fill="#17857b"/>
  <text x="773" y="148" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">DESTINO</text>
  <text x="795" y="200" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" text-anchor="middle">Laboratório</text>

  <line x1="208" y1="178" x2="190" y2="178" stroke="#6f91f5" stroke-width="7" stroke-linecap="round"/><circle cx="208" cy="178" r="5" fill="#ffffff" stroke="#5d83e8" stroke-width="2"/>
  <line x1="730" y1="178" x2="712" y2="178" stroke="#39c9bb" stroke-width="7" stroke-linecap="round"/><circle cx="712" cy="178" r="5" fill="#ffffff" stroke="#2caf9f" stroke-width="2"/>

  <line x1="300" y1="224" x2="300" y2="270" stroke="#8796b1" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="224" r="5" fill="#ffffff" stroke="#8796b1" stroke-width="2"/>
  <line x1="458" y1="224" x2="458" y2="270" stroke="#8796b1" stroke-width="4" stroke-linecap="round"/><circle cx="458" cy="224" r="5" fill="#ffffff" stroke="#8796b1" stroke-width="2"/>
  <line x1="620" y1="224" x2="620" y2="270" stroke="#8796b1" stroke-width="4" stroke-linecap="round"/><circle cx="620" cy="224" r="5" fill="#ffffff" stroke="#8796b1" stroke-width="2"/>

  <rect x="225" y="270" width="150" height="66" rx="17" fill="#ffffff" stroke="#d6deeb" stroke-width="2"/><text x="300" y="311" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" text-anchor="middle">Sala 101</text>
  <rect x="398" y="270" width="120" height="66" rx="17" fill="#ffffff" stroke="#d6deeb" stroke-width="2"/><text x="458" y="311" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle">Banheiro</text>
  <rect x="545" y="270" width="150" height="66" rx="17" fill="#ffffff" stroke="#d6deeb" stroke-width="2"/><text x="620" y="311" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" text-anchor="middle">Copa</text>

  <line x1="300" y1="336" x2="300" y2="365" stroke="#8796b1" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="336" r="5" fill="#ffffff" stroke="#8796b1" stroke-width="2"/>
  <rect x="225" y="365" width="150" height="58" rx="16" fill="#ffffff" stroke="#d6deeb" stroke-width="2"/><text x="300" y="401" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18.5" font-weight="750" text-anchor="middle">Sala 102</text>

  <line x1="620" y1="336" x2="620" y2="352" stroke="#8796b1" stroke-width="4" stroke-linecap="round"/><circle cx="620" cy="336" r="5" fill="#ffffff" stroke="#8796b1" stroke-width="2"/>
  <line x1="500" y1="352" x2="750" y2="352" stroke="#8796b1" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="620" cy="352" r="5" fill="#ffffff" stroke="#8796b1" stroke-width="2"/>
  <line x1="500" y1="352" x2="500" y2="365" stroke="#8796b1" stroke-width="3.5" stroke-linecap="round"/><line x1="750" y1="352" x2="750" y2="365" stroke="#8796b1" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="500" cy="352" r="4.5" fill="#ffffff" stroke="#8796b1" stroke-width="2"/><circle cx="750" cy="352" r="4.5" fill="#ffffff" stroke="#8796b1" stroke-width="2"/>
  <rect x="410" y="365" width="180" height="58" rx="16" fill="#ffffff" stroke="#d6deeb" stroke-width="2"/><text x="500" y="401" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" text-anchor="middle">Almoxarifado</text>
  <rect x="655" y="365" width="190" height="58" rx="16" fill="#ffffff" stroke="#d6deeb" stroke-width="2"/><text x="750" y="401" fill="#172033" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="750" text-anchor="middle">Sala de Reunião</text>

  <circle cx="48" cy="448" r="5" fill="#4f7cf7"/><text x="63" y="454" fill="#647087" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">locais conectados permitem deslocamento</text>
</svg>