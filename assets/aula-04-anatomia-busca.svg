<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia de uma busca</title>
  <desc id="desc">Fluxo comum de BFS e DFS: fronteira, retirada de estado, teste de objetivo, expansão, filtro de repetidos e inserção de sucessores, com registro de visitados.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#23324e" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a52a2a"/></marker>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.m{fill:#647087}.r{fill:#a52a2a}.h{font-weight:800}.box{fill:#fff;stroke:#dfe5ef;stroke-width:2}.cap{font-size:12.5px;fill:#647087}.step{font-size:16px;font-weight:800}</style>
  </defs>
  <rect x="1" y="1" width="958" height="538" rx="28" fill="#fbfcff" stroke="#dfe5ef" filter="url(#shadow)"/>
  <text x="480" y="48" text-anchor="middle" class="t h" font-size="34">Anatomia de uma busca</text>
  <text x="480" y="75" text-anchor="middle" class="t m" font-size="16">O esqueleto comum de BFS e DFS</text>

  <circle cx="410" cy="285" r="61" fill="#fff" stroke="#a52a2a" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="410" cy="285" r="38" fill="#fff" stroke="#a52a2a" stroke-width="2"/>
  <text x="410" y="292" text-anchor="middle" class="t h" font-size="22">Busca</text>

  <g>
    <rect x="330" y="108" width="160" height="84" rx="17" class="box"/><circle cx="410" cy="121" r="16" class="r"/><text x="410" y="127" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800">1</text><text x="410" y="151" text-anchor="middle" class="t step">Fronteira</text><text x="410" y="173" text-anchor="middle" class="cap">descobertos, ainda não explorados</text>
    <rect x="545" y="175" width="170" height="84" rx="17" class="box"/><circle cx="630" cy="188" r="16" class="r"/><text x="630" y="194" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800">2</text><text x="630" y="218" text-anchor="middle" class="t step">Retirar um estado</text><text x="630" y="240" text-anchor="middle" class="cap">escolher o próximo da fronteira</text>
    <rect x="545" y="316" width="170" height="84" rx="17" class="box"/><circle cx="630" cy="329" r="16" class="r"/><text x="630" y="335" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800">3</text><text x="630" y="359" text-anchor="middle" class="t step">Testar objetivo</text><text x="630" y="381" text-anchor="middle" class="cap">verificar se resolve o problema</text>
    <rect x="330" y="386" width="160" height="84" rx="17" class="box"/><circle cx="410" cy="399" r="16" class="r"/><text x="410" y="405" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800">4</text><text x="410" y="429" text-anchor="middle" class="t step">Expandir</text><text x="410" y="451" text-anchor="middle" class="cap">gerar sucessores válidos</text>
    <rect x="110" y="316" width="170" height="84" rx="17" class="box"/><circle cx="195" cy="329" r="16" class="r"/><text x="195" y="335" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800">5</text><text x="195" y="359" text-anchor="middle" class="t step">Filtrar repetidos</text><text x="195" y="381" text-anchor="middle" class="cap">evitar estados já considerados</text>
    <rect x="110" y="175" width="170" height="84" rx="17" class="box"/><circle cx="195" cy="188" r="16" class="r"/><text x="195" y="194" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="800">6</text><text x="195" y="218" text-anchor="middle" class="t step">Inserir sucessores</text><text x="195" y="240" text-anchor="middle" class="cap">colocar novos estados na fronteira</text>
  </g>

  <path d="M490 144 C530 145 545 160 563 180" fill="none" stroke="#a52a2a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M630 260 L630 305" fill="none" stroke="#a52a2a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 400 C525 430 505 438 488 438" fill="none" stroke="#a52a2a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M330 438 C295 438 280 420 265 399" fill="none" stroke="#a52a2a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M195 316 L195 270" fill="none" stroke="#a52a2a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M280 180 C300 155 318 145 330 145" fill="none" stroke="#a52a2a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="750" y="165" width="175" height="230" rx="20" fill="#fff" stroke="#a52a2a" stroke-width="2"/>
  <circle cx="837" cy="215" r="30" fill="#fff5f5" stroke="#a52a2a" stroke-width="2"/>
  <path d="M824 208 h26 v28 h-26 z M829 203 h16 v8 h-16 z" fill="none" stroke="#a52a2a" stroke-width="2.5"/><path d="M829 218 l4 4 7-8 M829 228 l4 4 7-8" fill="none" stroke="#a52a2a" stroke-width="2"/>
  <text x="837" y="270" text-anchor="middle" class="t h" font-size="23">Visitados</text>
  <text x="837" y="300" text-anchor="middle" class="t m" font-size="13">registro dos estados</text><text x="837" y="320" text-anchor="middle" class="t m" font-size="13">já considerados para</text><text x="837" y="340" text-anchor="middle" class="t m" font-size="13">evitar ciclos e repetições</text>

  <rect x="70" y="486" width="820" height="38" rx="14" fill="#fff" stroke="#a52a2a" stroke-width="2"/>
  <text x="480" y="511" text-anchor="middle" class="t h" font-size="17">BFS e DFS compartilham esse esqueleto. O que muda é a organização da fronteira.</text>
</svg>