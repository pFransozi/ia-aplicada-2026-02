<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">BFS versus DFS</title>
  <desc id="desc">A mesma árvore explorada por largura e por profundidade, mostrando ordens de visita distintas e a relação com fila e pilha.</desc>
  <defs><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.m{fill:#647087}.r{fill:#a52a2a}.h{font-weight:800}.edge{stroke:#8796b1;stroke-width:2.2}.nodeB{fill:#edf2ff;stroke:#3157d5;stroke-width:2}.nodeD{fill:#fff7df;stroke:#b66a07;stroke-width:2}.lab{font-size:13px;font-weight:800}.small{font-size:12px;fill:#647087}</style></defs>
  <rect x="1" y="1" width="958" height="538" rx="28" fill="#fbfcff" stroke="#dfe5ef"/>
  <text x="480" y="48" text-anchor="middle" class="t h" font-size="36">BFS × DFS</text><text x="480" y="75" text-anchor="middle" class="t m" font-size="16">A mesma árvore, duas ordens de exploração</text>
  <rect x="24" y="100" width="438" height="320" rx="22" fill="#fff" stroke="#dfe5ef" stroke-width="2"/><rect x="498" y="100" width="438" height="320" rx="22" fill="#fff" stroke="#dfe5ef" stroke-width="2"/>
  <text x="243" y="132" text-anchor="middle" class="r h" font-size="20">BFS — busca em largura</text><text x="717" y="132" text-anchor="middle" class="r h" font-size="20">DFS — busca em profundidade</text>
  <g opacity=".8"><rect x="45" y="150" width="395" height="54" rx="10" fill="#f3f7ff"/><rect x="45" y="208" width="395" height="70" rx="10" fill="#f7f9ff"/><rect x="45" y="282" width="395" height="70" rx="10" fill="#fbfcff"/><rect x="519" y="150" width="395" height="54" rx="10" fill="#fff9e9"/><rect x="519" y="208" width="395" height="70" rx="10" fill="#fffbf2"/><rect x="519" y="282" width="395" height="70" rx="10" fill="#fffdf8"/></g>
  <!-- BFS tree -->
  <g class="edge"><line x1="243" y1="172" x2="155" y2="232"/><line x1="243" y1="172" x2="243" y2="232"/><line x1="243" y1="172" x2="331" y2="232"/><line x1="155" y1="232" x2="122" y2="318"/><line x1="155" y1="232" x2="188" y2="318"/><line x1="331" y1="232" x2="298" y2="318"/><line x1="331" y1="232" x2="364" y2="318"/></g>
  <g class="t lab"><circle cx="243" cy="172" r="21" class="nodeB"/><text x="243" y="177" text-anchor="middle">A</text><circle cx="155" cy="232" r="20" class="nodeB"/><text x="155" y="237" text-anchor="middle">B</text><circle cx="243" cy="232" r="20" class="nodeB"/><text x="243" y="237" text-anchor="middle">C</text><circle cx="331" cy="232" r="20" class="nodeB"/><text x="331" y="237" text-anchor="middle">D</text><circle cx="122" cy="318" r="20" class="nodeB"/><text x="122" y="323" text-anchor="middle">E</text><circle cx="188" cy="318" r="20" class="nodeB"/><text x="188" y="323" text-anchor="middle">F</text><circle cx="298" cy="318" r="20" class="nodeB"/><text x="298" y="323" text-anchor="middle">G</text><circle cx="364" cy="318" r="20" class="nodeB"/><text x="364" y="323" text-anchor="middle">H</text></g>
  <text x="55" y="171" class="small">nível 0</text><text x="55" y="231" class="small">nível 1</text><text x="55" y="317" class="small">nível 2</text>
  <rect x="55" y="365" width="375" height="38" rx="12" fill="#f6f8fd" stroke="#dfe5ef"/><text x="68" y="389" class="t" font-size="13" font-weight="700">Ordem:</text><text x="130" y="389" class="t" font-size="13">A → B → C → D → E → F → G → H</text>
  <!-- DFS tree -->
  <g class="edge"><line x1="717" y1="172" x2="629" y2="232"/><line x1="717" y1="172" x2="717" y2="232"/><line x1="717" y1="172" x2="805" y2="232"/><line x1="629" y1="232" x2="596" y2="318"/><line x1="629" y1="232" x2="662" y2="318"/><line x1="805" y1="232" x2="772" y2="318"/><line x1="805" y1="232" x2="838" y2="318"/></g>
  <path d="M717 172 L629 232 L596 318" fill="none" stroke="#a52a2a" stroke-width="5" stroke-linecap="round"/><path d="M596 318 L662 318" fill="none" stroke="#a52a2a" stroke-width="5" stroke-linecap="round"/>
  <g class="t lab"><circle cx="717" cy="172" r="21" class="nodeD"/><text x="717" y="177" text-anchor="middle">A</text><circle cx="629" cy="232" r="20" class="nodeD"/><text x="629" y="237" text-anchor="middle">B</text><circle cx="717" cy="232" r="20" class="nodeD"/><text x="717" y="237" text-anchor="middle">C</text><circle cx="805" cy="232" r="20" class="nodeD"/><text x="805" y="237" text-anchor="middle">D</text><circle cx="596" cy="318" r="20" class="nodeD"/><text x="596" y="323" text-anchor="middle">E</text><circle cx="662" cy="318" r="20" class="nodeD"/><text x="662" y="323" text-anchor="middle">F</text><circle cx="772" cy="318" r="20" class="nodeD"/><text x="772" y="323" text-anchor="middle">G</text><circle cx="838" cy="318" r="20" class="nodeD"/><text x="838" y="323" text-anchor="middle">H</text></g>
  <text x="529" y="171" class="small">nível 0</text><text x="529" y="231" class="small">nível 1</text><text x="529" y="317" class="small">nível 2</text>
  <rect x="529" y="365" width="375" height="38" rx="12" fill="#fffaf0" stroke="#ead8ad"/><text x="542" y="389" class="t" font-size="13" font-weight="700">Ordem:</text><text x="604" y="389" class="t" font-size="13">A → B → E → F → C → D → G → H</text>
  <rect x="70" y="442" width="820" height="70" rx="18" fill="#fff" stroke="#dfe5ef"/><text x="122" y="468" class="t h" font-size="14">BFS</text><text x="168" y="468" class="small">explora por níveis · fronteira = fila (FIFO)</text><text x="540" y="468" class="t h" font-size="14">DFS</text><text x="586" y="468" class="small">aprofunda ramos · fronteira = pilha (LIFO)</text><text x="480" y="495" text-anchor="middle" class="t h" font-size="16">A política de retirada da fronteira muda o comportamento da busca.</text>
</svg>