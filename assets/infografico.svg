      <circle cx="42" cy="44" r="22" fill="#665fec"/>
      <text x="42" y="52" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="850">03</text>
      <text x="24" y="98" fill="#162033" font-size="23" font-weight="800">Busca</text>
      <text x="24" y="132" fill="#5d6b82" font-size="16">estado, custo,</text>
      <text x="24" y="157" fill="#5d6b82" font-size="16">heuristicas e</text>
      <text x="24" y="182" fill="#5d6b82" font-size="16">decisao</text>
