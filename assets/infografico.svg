<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Jornada de aprendizagem em Inteligencia Artificial Aplicada</title>
  <desc id="desc">Infografico com sete blocos da disciplina e os principais momentos avaliativos do semestre.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5f3"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#315efb"/>
      <stop offset=".55" stop-color="#7c67e8"/>
      <stop offset="1" stop-color="#16a5a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1d3661" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="42" fill="url(#bg)"/>
  <path d="M132 184h1176" fill="none" stroke="#d7e2ef" stroke-width="3"/>
  <path d="M132 184h1176" fill="none" stroke="url(#primary)" stroke-width="9" stroke-linecap="round" stroke-dasharray="103 75"/>

  <text x="120" y="95" fill="#162033" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">Jornada de aprendizagem</text>
  <text x="120" y="135" fill="#5d6b82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">Inteligencia Artificial Aplicada - 2026/2</text>

