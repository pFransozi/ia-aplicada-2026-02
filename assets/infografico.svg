      <circle cx="42" cy="44" r="22" fill="#2b9daf"/>
      <text x="42" y="52" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="850">06</text>
      <text x="24" y="98" fill="#162033" font-size="23" font-weight="800">IA Gen</text>
      <text x="24" y="132" fill="#5d6b82" font-size="16">uso critico,</text>
      <text x="24" y="157" fill="#5d6b82" font-size="16">prompts e</text>
      <text x="24" y="182" fill="#5d6b82" font-size="16">auditoria</text>
    </g>
    <g transform="translate(1262 230)">
      <rect width="174" height="250" rx="20" fill="#ffffff" stroke="#dce4ef"/>
      <circle cx="42" cy="44" r="22" fill="#16a5a3"/>
      <text x="42" y="52" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="850">07</text>
      <text x="24" y="98" fill="#162033" font-size="23" font-weight="800">Projeto</text>
      <text x="24" y="132" fill="#5d6b82" font-size="16">evidencias,</text>
      <text x="24" y="157" fill="#5d6b82" font-size="16">defesa e</text>
      <text x="24" y="182" fill="#5d6b82" font-size="16">entrega</text>
