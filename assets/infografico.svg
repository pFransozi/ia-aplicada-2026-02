      <text x="42" y="52" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="850">01</text>
      <text x="24" y="98" fill="#162033" font-size="23" font-weight="800">Problemas</text>
      <text x="24" y="132" fill="#5d6b82" font-size="16">formular,</text>
      <text x="24" y="157" fill="#5d6b82" font-size="16">delimitar e</text>
      <text x="24" y="182" fill="#5d6b82" font-size="16">representar</text>
    </g>
    <g transform="translate(282 230)">
      <rect width="174" height="250" rx="20" fill="#ffffff" stroke="#dce4ef"/>
      <circle cx="42" cy="44" r="22" fill="#4660f7"/>
