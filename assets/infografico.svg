    <text x="160" y="632" fill="#ffffff" font-size="30" font-weight="800">Momentos avaliativos</text>
    <text x="160" y="673" fill="#c5cee0" font-size="20">A disciplina combina registros de processo, atividades praticas, exercicios e um trabalho geral defendido ao final.</text>
    <g transform="translate(160 704)">
      <rect width="212" height="36" rx="18" fill="#315efb"/>
      <text x="106" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Processo - 10%</text>
    </g>
    <g transform="translate(392 704)">
      <rect width="212" height="36" rx="18" fill="#7c67e8"/>
      <text x="106" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Atividades - 20%</text>
    </g>
    <g transform="translate(624 704)">
      <rect width="212" height="36" rx="18" fill="#16a5a3"/>
      <text x="106" y="24" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Exercicios - 30%</text>
    </g>
    <g transform="translate(856 704)">
      <rect width="250" height="36" rx="18" fill="#d6ad26"/>
      <text x="125" y="24" text-anchor="middle" fill="#111b32" font-size="16" font-weight="850">Trabalho geral - 40%</text>
    </g>
  </g>

  <text x="120" y="835" fill="#5d6b82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Da formulacao do problema a validacao da solucao: aprender IA exige escolhas tecnicas justificadas por evidencias.</text>
</svg>
