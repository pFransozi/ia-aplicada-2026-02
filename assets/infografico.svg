      <text x="24" y="98" fill="#162033" font-size="23" font-weight="800">Agentes</text>
      <text x="24" y="132" fill="#5d6b82" font-size="16">ambiente,</text>
      <text x="24" y="157" fill="#5d6b82" font-size="16">percepcao e</text>
      <text x="24" y="182" fill="#5d6b82" font-size="16">acao</text>
