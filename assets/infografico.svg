      <circle cx="42" cy="44" r="22" fill="#7c67e8"/>
      <text x="42" y="52" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="850">04</text>
      <text x="24" y="98" fill="#162033" font-size="23" font-weight="800">Dados</text>
      <text x="24" y="132" fill="#5d6b82" font-size="16">preparar,</text>
